<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Register site styles for the preview pane
      CMS.registerPreviewStyle("/vibed-portfolio/styles/global.css");

      // Add basic preview styling
      CMS.registerPreviewStyle(`
        body {
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
          padding: 20px;
          background: #0a0a0f;
          color: #e4e4e7;
        }
        img {
          max-width: 100%;
          border-radius: 8px;
        }
      `, { raw: true });
    </script>
  </body>
</html>
